definitions:
  ios_env: &ios_env
    groups:
      - dort_ios_firebase
    vars:
      BUNDLE_ID: "com.dortapp.dort"
      XCODE_WORKSPACE: "ios/Runner.xcworkspace"
      XCODE_PROJECT: "ios/Runner.xcodeproj"
      XCODE_SCHEME: "Runner"
    flutter: stable
    xcode: latest
    cocoapods: default

  ios_build_scripts: &ios_build_scripts
    - name: Verify iOS Firebase configuration and Phone Auth URL schemes
      script: |
        set -euo pipefail
        if [[ -n "${GOOGLE_SERVICE_INFO_PLIST_B64:-}" ]]; then
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
        fi
        bash scripts/ios_firebase_configure.sh ios/Runner/GoogleService-Info.plist ios/Runner/Info.plist

    - name: Get Flutter packages and run static checks
      script: |
        set -euo pipefail
        rm -rf ios/Flutter/ephemeral/Packages \
          ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
          ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved \
          "$HOME/Library/Caches/org.swift.swiftpm"
        flutter pub get
        flutter analyze --no-fatal-infos
        CI_TESTS=()
        while IFS= read -r test_file; do
          CI_TESTS+=("$test_file")
        done < <(find test -maxdepth 1 -name '*_test.dart' \
          ! -name '*_visual_preview_test.dart' \
          ! -name 'gift_flow_screen_test.dart' | sort)
        flutter test "${CI_TESTS[@]}"

    - name: Set up iOS code signing via App Store Connect API
      script: |
        set -euo pipefail
        umask 077

        CERT_KEY_DIR="$(mktemp -d "${TMPDIR:-/tmp}/dort_cert_key.XXXXXX")"
        CERT_KEY_RAW="${CERT_KEY_DIR}/raw_key.pem"
        CERT_KEY_FILE="${CERT_KEY_DIR}/certificate_private_key.pem"

        cleanup_cert_key() {
          python3 - "$CERT_KEY_DIR" <<'PY' >/dev/null 2>&1 || true
        import os, shutil, sys
        target_dir = sys.argv[1]
        if os.path.isdir(target_dir):
            for root, _, files in os.walk(target_dir):
                for name in files:
                    path = os.path.join(root, name)
                    try:
                        size = os.path.getsize(path)
                        with open(path, "r+b") as f:
                            f.write(b"\x00" * size)
                            f.flush()
                            os.fsync(f.fileno())
                    except Exception:
                        pass
            shutil.rmtree(target_dir, ignore_errors=True)
        PY
          rm -rf "$CERT_KEY_DIR" 2>/dev/null || true
        }
        trap cleanup_cert_key EXIT INT TERM

        python3 - "$CERT_KEY_RAW" <<'PY'
        import base64, os, re, sys

        out_path = sys.argv[1]
        raw = os.environ.get("CERTIFICATE_PRIVATE_KEY")
        if not raw or not raw.strip():
            print(
                "ERROR: CERTIFICATE_PRIVATE_KEY is unset or empty. "
                "Add the 2048-bit RSA PEM private key to the Codemagic environment variable group (dort_ios_firebase).",
                file=sys.stderr,
            )
            sys.exit(1)

        notes = []
        text = raw
        cleaned = re.sub(r"[\ufeff\u200b\u200c\u200d]", "", text)
        if cleaned != text:
            text = cleaned
            notes.append("stripped_invisible_unicode")

        text = text.strip()
        if len(text) >= 2 and text[0] == text[-1] and text[0] in ("'", '"'):
            text = text[1:-1].strip()
            notes.append("stripped_wrapping_quotes")

        if "\r" in text:
            text = text.replace("\r\n", "\n").replace("\r", "\n")
            notes.append("normalized_crlf")

        if "\\n" in text and "\n" not in text:
            text = text.replace("\\r\\n", "\n").replace("\\n", "\n")
            notes.append("expanded_escaped_newlines")

        if "-----BEGIN " not in text:
            compact = re.sub(r"\s+", "", text)
            if len(compact) >= 64 and re.fullmatch(r"[A-Za-z0-9+/=]+", compact):
                try:
                    decoded = base64.b64decode(compact, validate=True).decode("utf-8")
                    if "-----BEGIN " in decoded:
                        text = decoded.replace("\r\n", "\n").replace("\r", "\n").strip()
                        notes.append("decoded_base64_pem")
                except Exception:
                    pass

        match = re.search(
            r"-----BEGIN ([A-Z0-9 ]+)-----(.*?)-----END \1-----",
            text,
            re.DOTALL,
        )
        if not match:
            has_begin = "-----BEGIN " in text
            has_end = "-----END " in text
            print(
                f"ERROR: CERTIFICATE_PRIVATE_KEY does not contain a complete PEM block "
                f"(raw_len={len(raw)}, has_begin={has_begin}, has_end={has_end}, notes={notes or ['none']}). "
                "Ensure the full key including BEGIN and END lines is stored without truncation.",
                file=sys.stderr,
            )
            sys.exit(1)

        label = match.group(1).strip()
        body_raw = match.group(2)

        if "ENCRYPTED" in label or "Proc-Type:" in body_raw or "DEK-Info:" in body_raw:
            print(
                f"ERROR: CERTIFICATE_PRIVATE_KEY appears encrypted (header='BEGIN {label}'). "
                "Codemagic requires an unencrypted 2048-bit RSA PEM private key.",
                file=sys.stderr,
            )
            sys.exit(1)

        if label not in ("RSA PRIVATE KEY", "PRIVATE KEY"):
            print(
                f"ERROR: Unsupported PEM header 'BEGIN {label}'. "
                "Expected 'BEGIN RSA PRIVATE KEY' (2048-bit RSA PKCS#1 PEM) or 'BEGIN PRIVATE KEY' (unencrypted RSA PKCS#8 PEM).",
                file=sys.stderr,
            )
            sys.exit(1)

        body_b64 = re.sub(r"\s+", "", body_raw)
        if not body_b64 or not re.fullmatch(r"[A-Za-z0-9+/=]+", body_b64):
            print(
                f"ERROR: CERTIFICATE_PRIVATE_KEY body contains invalid Base64 characters "
                f"(header='BEGIN {label}', body_chars={len(body_b64)}, notes={notes or ['none']}).",
                file=sys.stderr,
            )
            sys.exit(1)

        try:
            base64.b64decode(body_b64, validate=True)
        except Exception:
            print(
                f"ERROR: CERTIFICATE_PRIVATE_KEY body failed Base64 decoding "
                f"(header='BEGIN {label}', body_chars={len(body_b64)}, notes={notes or ['none']}). "
                "The stored key may be truncated or corrupted.",
                file=sys.stderr,
            )
            sys.exit(1)

        wrapped = "\n".join(body_b64[i:i + 64] for i in range(0, len(body_b64), 64))
        canonical_pem = f"-----BEGIN {label}-----\n{wrapped}\n-----END {label}-----\n"
        if canonical_pem != raw:
            notes.append("canonicalized_pem_wrapping")

        fd = os.open(out_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
        with os.fdopen(fd, "wb") as f:
            f.write(canonical_pem.encode("ascii"))

        print(
            f"Prepared temporary PEM key: header='BEGIN {label}', "
            f"lines={canonical_pem.count(chr(10))}, bytes={len(canonical_pem)}, "
            f"normalizations={','.join(notes) if notes else 'none'}"
        )
        PY

        HEADER_LINE="$(head -n 1 "$CERT_KEY_RAW")"
        if [[ "$HEADER_LINE" == "-----BEGIN RSA PRIVATE KEY-----" ]]; then
          cp "$CERT_KEY_RAW" "$CERT_KEY_FILE"
          chmod 600 "$CERT_KEY_FILE"
        else
          if ! openssl rsa -in "$CERT_KEY_RAW" -traditional -out "$CERT_KEY_FILE" >/dev/null 2>&1; then
            if ! openssl rsa -in "$CERT_KEY_RAW" -out "$CERT_KEY_FILE" >/dev/null 2>&1; then
              echo "ERROR: OpenSSL could not parse CERTIFICATE_PRIVATE_KEY as an RSA private key (it may be an EC/App Store Connect .p8 API key instead of the 2048-bit RSA signing certificate key)." >&2
              exit 1
            fi
          fi
          chmod 600 "$CERT_KEY_FILE"
          echo "Converted PKCS#8 RSA key to PKCS#1 (BEGIN RSA PRIVATE KEY)."
        fi

        if ! openssl rsa -in "$CERT_KEY_FILE" -check -noout >/dev/null 2>&1; then
          echo "ERROR: OpenSSL RSA key validation failed (openssl rsa -check). Verify CERTIFICATE_PRIVATE_KEY contains the complete unencrypted 2048-bit RSA private key." >&2
          exit 1
        fi

        KEY_BITS="$(openssl pkey -in "$CERT_KEY_FILE" -text_pub -noout 2>/dev/null | awk -F'[()]' '/Public-Key:/ {print $2; exit}')"
        echo "OpenSSL validation passed: RSA key ok (${KEY_BITS:-unknown size})."

        keychain initialize
        app-store-connect fetch-signing-files "$BUNDLE_ID" \
          --type IOS_APP_STORE \
          --certificate-key="@file:${CERT_KEY_FILE}" \
          --create
        keychain add-certificates
        xcode-project use-profiles

    - name: Resolve iOS build number
      script: |
        set -euo pipefail

        PUBSPEC_FULL_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '\r')"
        PUBSPEC_VERSION="${PUBSPEC_FULL_VERSION%%+*}"
        PUBSPEC_BUILD="${PUBSPEC_FULL_VERSION#*+}"
        if [[ -z "$PUBSPEC_VERSION" || "$PUBSPEC_BUILD" == "$PUBSPEC_FULL_VERSION" || ! "$PUBSPEC_BUILD" =~ ^[0-9]+$ || "$PUBSPEC_BUILD" -le 0 ]]; then
          echo "ERROR: Invalid version format in pubspec.yaml: '$PUBSPEC_FULL_VERSION' (expected '<name>+<positive-int>')." >&2
          exit 1
        fi

        RESOLVED_APP_ID="${APP_STORE_APPLE_ID:-}"
        if [[ -n "$RESOLVED_APP_ID" ]]; then
          if [[ ! "$RESOLVED_APP_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: APP_STORE_APPLE_ID must be a numeric Apple App ID (got an invalid non-numeric value)." >&2
            exit 1
          fi
        else
          echo "APP_STORE_APPLE_ID is not set; resolving Apple App ID from App Store Connect for bundle ID '$BUNDLE_ID'..."
          APPS_JSON="$(app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json)" || {
            echo "ERROR: Failed to query App Store Connect apps list for bundle ID '$BUNDLE_ID'." >&2
            exit 1
          }
          RESOLVED_APP_ID="$(python3 - "$BUNDLE_ID" "$APPS_JSON" <<'PY'
        import json, sys

        bundle_id, raw_json = sys.argv[1], sys.argv[2]
        try:
            payload = json.loads(raw_json)
        except Exception as exc:
            print(f"ERROR: Could not parse App Store Connect apps list JSON: {exc}", file=sys.stderr)
            sys.exit(1)

        apps = payload if isinstance(payload, list) else ([payload] if isinstance(payload, dict) else None)
        if apps is None:
            print("ERROR: Unexpected App Store Connect apps list payload shape.", file=sys.stderr)
            sys.exit(1)

        matched_ids = [
            str(app.get("id", "")).strip()
            for app in apps
            if isinstance(app, dict)
            and str((app.get("attributes") or {}).get("bundleId", "")).strip() == bundle_id
            and str(app.get("id", "")).strip().isdigit()
        ]
        if len(matched_ids) != 1:
            print(
                f"ERROR: Expected exactly 1 App Store Connect app matching '{bundle_id}', found {len(matched_ids)}. "
                "Set numeric APP_STORE_APPLE_ID in the Codemagic environment group if needed.",
                file=sys.stderr,
            )
            sys.exit(1)

        print(matched_ids[0])
        PY
          )"
        fi

        echo "Querying App Store Connect highest uploaded iOS build number for App ID $RESOLVED_APP_ID..."

        LATEST_TRACK_RAW="$(app-store-connect get-latest-build-number "$RESOLVED_APP_ID" \
          --platform IOS \
          --all-versions)" || {
          echo "ERROR: Failed to query latest iOS build number via 'app-store-connect get-latest-build-number'. Refusing to fall back to 0." >&2
          exit 1
        }

        BUILDS_JSON="$(app-store-connect builds list \
          --app-id "$RESOLVED_APP_ID" \
          --platform IOS \
          --json)" || {
          echo "ERROR: Failed to list uploaded iOS builds via 'app-store-connect builds list'. Refusing to fall back to 0." >&2
          exit 1
        }

        NEXT_BUILD="$(python3 - "$PUBSPEC_BUILD" "$LATEST_TRACK_RAW" "$BUILDS_JSON" <<'PY'
        import json, re, sys

        pubspec_build = int(sys.argv[1])
        latest_track_raw = sys.argv[2].strip()
        builds_raw = sys.argv[3].strip()

        def parse_build_int(value: str, source: str) -> int:
            cleaned = value.strip()
            if not cleaned:
                return 0
            if cleaned.isdigit():
                return int(cleaned)
            match = re.fullmatch(r"([0-9]+)(?:\.[0-9]+)*", cleaned)
            if match:
                return int(match.group(1))
            print(f"ERROR: Unparseable build number '{cleaned}' returned by {source}.", file=sys.stderr)
            sys.exit(1)

        track_max = 0
        if latest_track_raw:
            lines = [line.strip() for line in latest_track_raw.splitlines() if line.strip()]
            if len(lines) != 1:
                print(
                    f"ERROR: Expected a single build number line from get-latest-build-number, got {len(lines)} lines.",
                    file=sys.stderr,
                )
                sys.exit(1)
            track_max = parse_build_int(lines[0], "get-latest-build-number")

        if not builds_raw:
            print("ERROR: Empty JSON output from 'app-store-connect builds list'. Refusing to fall back to 0.", file=sys.stderr)
            sys.exit(1)

        try:
            payload = json.loads(builds_raw)
        except Exception as exc:
            print(f"ERROR: Could not parse 'app-store-connect builds list' JSON: {exc}", file=sys.stderr)
            sys.exit(1)

        builds = payload if isinstance(payload, list) else ([payload] if isinstance(payload, dict) else None)
        if builds is None:
            print("ERROR: Unexpected JSON payload shape from 'app-store-connect builds list'.", file=sys.stderr)
            sys.exit(1)

        builds_max = 0
        for item in builds:
            if not isinstance(item, dict):
                print("ERROR: Unexpected build entry in 'app-store-connect builds list'.", file=sys.stderr)
                sys.exit(1)
            attrs = item.get("attributes") or {}
            version = str(attrs.get("version", "")).strip()
            if not version:
                print("ERROR: Missing attributes.version in 'app-store-connect builds list' entry.", file=sys.stderr)
                sys.exit(1)
            parsed = parse_build_int(version, "builds list")
            if parsed > builds_max:
                builds_max = parsed

        apple_highest = max(track_max, builds_max)
        next_build = max(pubspec_build, apple_highest + 1)

        if next_build <= apple_highest:
            print(
                f"ERROR: Computed next build ({next_build}) is not greater than Apple highest build ({apple_highest}).",
                file=sys.stderr,
            )
            sys.exit(1)

        print(
            f"Resolved iOS build numbers: pubspec={pubspec_build}, "
            f"apple_track_max={track_max}, apple_builds_list_max={builds_max} (count={len(builds)}), "
            f"apple_highest={apple_highest} -> next={next_build}",
            file=sys.stderr,
        )
        print(next_build)
        PY
        )"

        if [[ -z "$NEXT_BUILD" || ! "$NEXT_BUILD" =~ ^[0-9]+$ ]]; then
          echo "ERROR: Failed to compute a valid numeric NEXT_IOS_BUILD_NUMBER." >&2
          exit 1
        fi

        echo "NEXT_IOS_BUILD_NAME=$PUBSPEC_VERSION" >> "$CM_ENV"
        echo "NEXT_IOS_BUILD_NUMBER=$NEXT_BUILD" >> "$CM_ENV"
        echo "Using iOS build version: ${PUBSPEC_VERSION}+${NEXT_BUILD}"

    - name: Build signed iOS IPA (TestFlight target)
      script: |
        set -euo pipefail
        flutter build ipa --release \
          --build-name="$NEXT_IOS_BUILD_NAME" \
          --build-number="$NEXT_IOS_BUILD_NUMBER" \
          --dart-define=DISTRIBUTION_TARGET=test \
          --export-options-plist=/Users/builder/export_options.plist

workflows:
  ios-testflight-build:
    name: Dört. iOS Signed Build (Verify Only - No Upload)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: dort_app_store_connect
    environment: *ios_env
    scripts: *ios_build_scripts
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

  ios-testflight-upload:
    name: Dört. iOS TestFlight Upload (Manual Trigger Only)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: dort_app_store_connect
    environment: *ios_env
    scripts: *ios_build_scripts
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
