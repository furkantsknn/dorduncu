name: dorduncu
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+30

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: 4.14.0
  firebase_auth: 6.6.1
  cloud_firestore: 6.9.0
  cloud_functions: 6.4.0
  firebase_app_check: 0.4.7
  firebase_storage: 13.5.0

  image_picker: ^1.2.0
  file_picker: ^10.3.2

  intl: ^0.20.2

  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: 14.0.2

  shared_preferences: ^2.5.5
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7+1
  photo_view: ^0.15.0
  syncfusion_flutter_pdfviewer: ^31.1.17
  async: ^2.13.1
  package_info_plus: ^9.0.1
  firebase_messaging: 16.6.0
  firebase_analytics: 12.5.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.11
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  firebase_auth_platform_interface: ^9.0.7

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/games/
    - assets/images/badges/premium_v1/
    - assets/legal/tr/
    - assets/legal/en/
    - assets/legal/de/
    - assets/data/turkey_locations.json
    - assets/branding/dort_logo_white_orange.png
    - assets/branding/dort_logo_black_orange.png
    - assets/branding/dort_d_mark_source.png
